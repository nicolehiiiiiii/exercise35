<!DOCTYPE html>
<html>
<head>
    <title>JS作業第3題</title>
</head>
<body>

    <h2>Question 3</h2>
    <p>Write a JavaScript program to list all properties of the following object. Then delete the age property from the object. Also print the object after deleting the property.</p>

    <hr>

    <h3>1. 物件的所有屬性 (Properties):</h3>
    <p id="show-properties"></p>

    <h3>2. 刪除 age 屬性後的物件結果:</h3>
    <pre id="show-object"></pre>

    <script>
        // 題目給的原始物件
        var Person = {
            firstName : "Tony",
            lastName : "Lee",
            age : 50,
            eyeColor : "Blue"
        };

        // 1. 抓出所有屬性並顯示在網頁上
        var keys = Object.keys(Person);
        document.getElementById("show-properties").innerHTML = keys.join(", ");

        // 2. 刪除 age 屬性
        delete Person.age;

        // 3. 把刪除後的物件轉成文字顯示在網頁上
        document.getElementById("show-object").innerHTML = JSON.stringify(Person, null, 2);
    </script>

</body>
</html>
